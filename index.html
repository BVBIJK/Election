<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-50:  #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-800: #1e40af;
      --blue-900: #1e3a8a;

      --bg:       #f0f4fb;
      --surface:  #ffffff;
      --surface2: #f8faff;
      --border:   #e2e8f4;
      --border2:  #c7d4ed;
      --text:     #0f1729;
      --text2:    #4a5578;
      --muted:    #8a96b0;

      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --ok:       #16a34a;
      --ok-bg:    #f0fdf4;
      --ok-border:#bbf7d0;
      --err:      #dc2626;
      --err-bg:   #fef2f2;
      --err-border:#fecaca;

      --font: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 10px;
      --radius-lg: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--blue-700);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    header h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    header h1 span { color: var(--blue-200); }
    #last-refresh {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: rgba(255,255,255,0.5);
    }

    /* ── Toolbar ── */
    #toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #load-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }
    #load-btn:hover { background: var(--accent-h); }
    #load-btn:active { transform: scale(0.97); }
    #load-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #toolbar-note { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }

    /* ── Main ── */
    main { padding: 1.75rem 2rem; max-width: 1100px; margin: 0 auto; }

    /* ── Status ── */
    #status-msg {
      font-size: 0.8rem;
      font-family: var(--mono);
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      display: none;
      border: 1px solid;
    }
    #status-msg.info   { background: var(--blue-50); color: var(--blue-700); border-color: var(--blue-200); }
    #status-msg.error  { background: var(--err-bg); color: var(--err); border-color: var(--err-border); }
    #status-msg.success{ background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }

    /* ── Stat cards ── */
    #summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 99px 99px 0 0;
    }
    .stat-card.c1::before { background: var(--blue-500); }
    .stat-card.c2::before { background: #7c3aed; }
    .stat-card.c3::before { background: #0891b2; }
    .stat-card.c4::before { background: #d97706; }
    .stat-card .s-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }
    .stat-card .s-val {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      font-family: var(--mono);
    }
    .stat-card.c1 .s-val { color: var(--blue-600); }
    .stat-card.c2 .s-val { color: #7c3aed; }
    .stat-card.c3 .s-val { color: #0891b2; }
    .stat-card.c4 .s-val { color: #d97706; }

    /* ── Section heading ── */
    .sec-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.85rem;
    }
    .sec-head-line {
      width: 3px; height: 16px;
      border-radius: 99px;
      background: var(--accent);
    }
    .sec-head h2 {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    /* ── Category blocks ── */
    #categories-wrap { margin-bottom: 2rem; }
    .category-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .cat-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .cat-pill {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 500;
      background: var(--blue-50);
      color: var(--blue-700);
      border: 1px solid var(--blue-200);
      border-radius: 99px;
      padding: 2px 10px;
    }

    /* ── Candidate rows ── */
    .cand-row {
      padding: 0.8rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 240px 60px;
      align-items: center;
      gap: 1rem;
    }
    .cand-row:last-child { border-bottom: none; }
    .cand-name-wrap { display: flex; align-items: center; gap: 8px; }
    .cand-rank {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: var(--blue-50);
      color: var(--blue-600);
      font-size: 0.7rem;
      font-weight: 700;
      font-family: var(--mono);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cand-rank.first {
      background: var(--blue-600);
      color: #fff;
    }
    .cand-name { font-size: 0.875rem; font-weight: 500; color: var(--text); }
    .leading-badge {
      font-size: 0.6rem;
      font-weight: 700;
      font-family: var(--mono);
      background: var(--blue-600);
      color: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-track {
      flex: 1;
      height: 7px;
      background: var(--blue-50);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--blue-100);
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .bar-pct {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      min-width: 30px;
      text-align: right;
    }
    .cand-count {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--blue-700);
      text-align: right;
    }

    /* ── Node table ── */
    #node-log-wrap { margin-bottom: 2rem; }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    thead tr { background: var(--surface2); }
    th {
      font-family: var(--mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      padding: 0.65rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      color: var(--text2);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--blue-50); }
    .status-ok {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--ok-bg); color: var(--ok);
      border: 1px solid var(--ok-border);
      border-radius: 5px; padding: 2px 8px;
      font-size: 0.68rem; font-weight: 600;
    }
    .status-fail {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--err-bg); color: var(--err);
      border: 1px solid var(--err-border);
      border-radius: 5px; padding: 2px 8px;
      font-size: 0.68rem; font-weight: 600;
    }
    .fname { color: var(--text); font-weight: 500; }
    .node-tag {
      background: var(--blue-50);
      color: var(--blue-700);
      border: 1px solid var(--blue-200);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 0.7rem;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Placeholder ── */
    #placeholder {
      text-align: center;
      padding: 5rem 2rem;
    }
    #placeholder .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.25;
    }
    #placeholder p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      main { padding: 1rem; }
      header { padding: 0 1rem; }
      #toolbar { padding: 0.7rem 1rem; }
      .cand-row { grid-template-columns: 1fr auto; }
      .bar-cell { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">🗳</div>
    <h1>Vote <span>Admin</span></h1>
  </div>
  <span id="last-refresh">not loaded</span>
</header>

<div id="toolbar">
  <button id="load-btn" onclick="loadAll()">
    <span>↻</span> Refresh Votes
  </button>
  <span id="toolbar-note">auto-discovers all CSVs from votes/</span>
</div>

<main>
  <div id="status-msg"></div>

  <div id="placeholder">
    <div class="icon">📊</div>
    <p>Loading votes from your repository…</p>
  </div>

  <div id="dashboard" style="display:none">
    <div id="summary-grid"></div>

    <div id="categories-wrap">
      <div class="sec-head"><div class="sec-head-line"></div><h2>Results by category</h2></div>
      <div id="cat-blocks"></div>
    </div>

    <div id="node-log-wrap">
      <div class="sec-head"><div class="sec-head-line"></div><h2>Node file log</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>File</th><th>Node</th><th>Records</th><th>Status</th><th>Exported At</th>
          </tr></thead>
          <tbody id="node-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const BAR_COLORS = ['#2563eb','#7c3aed','#0891b2','#d97706','#059669','#dc2626','#db2777','#65a30d'];

function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
}
function hideStatus() { document.getElementById('status-msg').style.display = 'none'; }

async function fetchCsv(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
  return res.text();
}

async function discoverCsvPaths() {
  const parts = location.hostname.split('.');
  const owner = parts[0];
  const pathParts = location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
  const repo = pathParts[0] || '';
  if (!repo) throw new Error("Could not detect repo name from URL. Make sure GitHub Pages is served from a /repo path.");
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/votes`;
  const res = await fetch(apiUrl);
  if (!res.ok) throw new Error(`GitHub API error ${res.status} — make sure the repo is public.`);
  const files = await res.json();
  return files.filter(f => f.name.endsWith('.csv')).map(f => `votes/${f.name}`);
}

function parseCsv(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] || '');
    return obj;
  });
}

function nodeNameFromPath(path) {
  const fname = path.split('/').pop();
  const match = fname.match(/Node_(\d+)/i);
  return match ? `Node ${match[1]}` : fname;
}

async function loadAll() {
  const btn = document.getElementById('load-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Loading…';
  showStatus('Discovering CSV files…', 'info');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('placeholder').style.display = 'none';

  try {
    const paths = await discoverCsvPaths();
    if (paths.length === 0) {
      showStatus('No CSV files found in the votes/ folder.', 'error');
      document.getElementById('placeholder').style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<span>↻</span> Refresh Votes'; return;
    }
    showStatus(`Found ${paths.length} file(s). Fetching…`, 'info');

    const nodeLog = [], allRecords = [];
    for (const path of paths) {
      const fname = path.split('/').pop();
      const node = nodeNameFromPath(path);
      try {
        const raw = await fetchCsv(path);
        const records = parseCsv(raw);
        const latestExport = records.map(r => r['Exported At']).filter(Boolean).sort().pop() || '—';
        nodeLog.push({ file: fname, node, count: records.length, status: 'ok', exported: latestExport });
        allRecords.push(...records);
      } catch(e) {
        nodeLog.push({ file: fname, node, count: 0, status: 'fail', exported: '—' });
      }
    }

    renderDashboard(allRecords, nodeLog, paths.length);
    hideStatus();
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('last-refresh').textContent = 'refreshed ' + new Date().toLocaleTimeString();
  } catch(e) {
    showStatus('Error: ' + e.message, 'error');
    document.getElementById('placeholder').innerHTML = '<div class="icon">⚠️</div><p>' + e.message + '</p>';
    document.getElementById('placeholder').style.display = 'block';
  }

  btn.disabled = false;
  btn.innerHTML = '<span>↻</span> Refresh Votes';
}

window.addEventListener('load', loadAll);

function renderDashboard(records, nodeLog, totalFiles) {
  const catMap = {};
  records.forEach(r => {
    const cat = r['Category'] || 'Unknown';
    const name = r['Name'] || 'Unknown';
    const votes = parseInt(r['Votes']) || 0;
    if (!catMap[cat]) catMap[cat] = {};
    if (!catMap[cat][name]) catMap[cat][name] = 0;
    catMap[cat][name] += votes;
  });

  const categories = Object.keys(catMap);
  let totalVotes = 0;
  records.forEach(r => { totalVotes += parseInt(r['Votes']) || 0; });

  document.getElementById('summary-grid').innerHTML = `
    <div class="stat-card c1"><div class="s-label">Total votes cast</div><div class="s-val">${totalVotes}</div></div>
    <div class="stat-card c2"><div class="s-label">Nodes loaded</div><div class="s-val">${totalFiles}</div></div>
    <div class="stat-card c3"><div class="s-label">Categories</div><div class="s-val">${categories.length}</div></div>
    <div class="stat-card c4"><div class="s-label">Candidates</div><div class="s-val">${new Set(records.map(r=>r['Name'])).size}</div></div>
  `;

  const catWrap = document.getElementById('cat-blocks');
  catWrap.innerHTML = '';
  categories.forEach((cat, ci) => {
    const nameMap = catMap[cat];
    const catTotal = Object.values(nameMap).reduce((a,b)=>a+b,0);
    const sorted = Object.entries(nameMap).sort((a,b) => b[1]-a[1]);
    const maxVotes = sorted[0]?.[1] || 1;
    const color = BAR_COLORS[ci % BAR_COLORS.length];

    const block = document.createElement('div');
    block.className = 'category-block';
    block.innerHTML = `
      <div class="cat-header">
        <span class="cat-name">${cat}</span>
        <span class="cat-pill">${catTotal} votes · ${sorted.length} candidate${sorted.length!==1?'s':''}</span>
      </div>
    `;
    sorted.forEach(([name, votes], idx) => {
      const pct = Math.round((votes / maxVotes) * 100);
      const isWinner = idx === 0;
      const row = document.createElement('div');
      row.className = 'cand-row';
      row.innerHTML = `
        <div class="cand-name-wrap">
          <div class="cand-rank${isWinner?' first':''}">${idx+1}</div>
          <span class="cand-name">${name}</span>
          ${isWinner ? '<span class="leading-badge">Leading</span>' : ''}
        </div>
        <div class="bar-cell">
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <span class="bar-pct">${pct}%</span>
        </div>
        <div class="cand-count" style="color:${color}">${votes}</div>
      `;
      block.appendChild(row);
    });
    catWrap.appendChild(block);
  });

  const tbody = document.getElementById('node-tbody');
  tbody.innerHTML = '';
  nodeLog.forEach(n => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="fname">${n.file}</td>
      <td><span class="node-tag">${n.node}</span></td>
      <td>${n.count}</td>
      <td>${n.status==='ok'
        ? '<span class="status-ok">✓ ok</span>'
        : '<span class="status-fail">✗ failed</span>'}</td>
      <td>${n.exported}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
